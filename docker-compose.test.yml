name: node3-test

services:
    db:
        image: postgres:17
        environment:
            POSTGRES_USER: journal
            POSTGRES_PASSWORD: journal
            POSTGRES_DB: journal
        ports:
            - '127.0.0.1::5432'
        tmpfs:
            - /var/lib/postgresql/data
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U journal -d journal']
            interval: 1s
            timeout: 3s
            retries: 60

    app:
        build:
            context: .
            args:
                GIT_COMMIT_SHA: ${GIT_COMMIT_SHA:-unknown}
        environment:
            DATABASE_URL: postgres://journal:journal@db:5432/journal
            PORT: 3000
        ports:
            - '127.0.0.1::3000'
        depends_on:
            db:
                condition: service_healthy
        healthcheck:
            test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3000/version || exit 1']
            interval: 1s
            timeout: 3s
            retries: 60

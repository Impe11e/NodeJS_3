name: traefik

services:
    traefik:
        image: traefik:v3.4
        command:
            - --providers.docker=true
            - --providers.docker.exposedbydefault=false
            - --providers.docker.network=traefik
            - --entrypoints.web.address=:80
            - --api.dashboard=true
            - --api.insecure=true
        ports:
            - '80:80'
            - '127.0.0.1:8080:8080'
        volumes:
            - /var/run/docker.sock:/var/run/docker.sock:ro
        networks:
            - traefik

networks:
    traefik:
        name: traefik
